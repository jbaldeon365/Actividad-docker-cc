services:
  streamlit:
    image: python:3.11-slim
    container_name: ecommerce_streamlit_ai
    working_dir: /app
    ports:
      - "8501:8501"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ecommerce_db
      MONGO_COLLECTION: pedidos
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./streamlit:/app
    depends_on:
      - mongodb
      - redis
    command: >
      bash -c "
      pip install --no-cache-dir -r requirements.txt &&
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501
      "

  mongodb:
    image: mongo:7
    container_name: ecommerce_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: ecommerce_mongo_express
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

  redis:
    image: redis:7
    container_name: ecommerce_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ecommerce_redis_commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  mongo_data:
  redis_data: